name: Import Status Groupp source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-source.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace repository with source project
        run: |
          cp status-groupp-project.zip /tmp/status-groupp-project.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/status-groupp-project.zip -d .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Import Status Groupp source"
          git push origin main
