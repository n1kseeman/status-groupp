name: Import Status Groupp source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-source.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import source while preserving workflow permissions
        run: |
          mkdir -p /tmp/status-groupp-source
          unzip -q status-groupp-project.zip -d /tmp/status-groupp-source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude='.github/' /tmp/status-groupp-source/ .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Import Status Groupp source"
          git push origin main
